<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>SkyRadar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--g:#2dff8a;--bg:#000b06}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--g);font-family:system-ui,sans-serif;overflow:hidden}
#map{position:fixed;inset:0;background:#02140d}
#sw{position:absolute;z-index:450;pointer-events:none;border-radius:50%;border:1px solid rgba(45,255,138,.6);background:conic-gradient(from 0deg,rgba(45,255,138,0) 0deg,rgba(45,255,138,0) 280deg,rgba(45,255,138,.38) 358deg,rgba(45,255,138,.9) 360deg);box-shadow:0 0 30px rgba(45,255,138,.3),inset 0 0 40px rgba(45,255,138,.15)}
#top{position:fixed;z-index:1000;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;justify-content:space-between;align-items:center;font:600 12px ui-monospace,monospace;letter-spacing:2px;background:linear-gradient(#000b06ee,#000b0600);text-shadow:0 0 8px var(--g)}
#rng{position:fixed;z-index:1000;top:calc(env(safe-area-inset-top,0px) + 44px);left:10px;display:flex;gap:6px}
.b{background:#00170dd9;color:var(--g);border:1px solid #1b6b3d;padding:7px 12px;border-radius:16px;font:12px ui-monospace,monospace;backdrop-filter:blur(6px)}
.b.on{background:var(--g);color:#001a0d}
#side{position:fixed;z-index:1000;right:10px;top:calc(env(safe-area-inset-top,0px) + 44px);display:flex;flex-direction:column;gap:8px}
#side .b{width:40px;height:40px;padding:0;font-size:18px;display:flex;align-items:center;justify-content:center}
.pl{position:relative;width:30px;height:30px}
.pl svg{width:30px;height:30px;filter:drop-shadow(0 0 5px #2dff8a);fill:#2dff8a;transition:transform .4s linear}
.pl span{position:absolute;left:30px;top:2px;font:600 10px ui-monospace,monospace;color:#d9ffe9;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap}
.pl.hit svg{filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 18px #2dff8a);fill:#eafff2}
.pl.sel svg{fill:#ffd84a;filter:drop-shadow(0 0 10px #ffd84a)}
.pl.sel span{color:#ffd84a}
.me{width:18px;height:18px;border-radius:50%;background:#4aa8ff;border:3px solid #fff;box-shadow:0 0 0 0 rgba(74,168,255,.7);animation:p 2s infinite}
@keyframes p{70%{box-shadow:0 0 0 22px rgba(74,168,255,0)}100%{box-shadow:0 0 0 0 rgba(74,168,255,0)}}
.pin{font:700 11px ui-monospace,monospace;background:#fff;color:#000;border-radius:10px;padding:2px 7px;box-shadow:0 0 8px #000;white-space:nowrap;transform:translate(-50%,-50%)}
#card{position:fixed;z-index:1000;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);background:#101418f2;color:#eee;border-radius:18px;overflow:hidden;transform:translateY(130%);transition:transform .4s cubic-bezier(.2,.9,.3,1);box-shadow:0 0 30px rgba(0,0,0,.8);max-height:62vh;overflow-y:auto}
#card.show{transform:none}
.hd{display:flex;justify-content:space-between;align-items:stretch;background:#0b0f12}
.hd .l{padding:12px 14px}
.cs{font:700 22px ui-monospace,monospace;color:#ffb84a}
.ch{display:inline-block;font:600 11px ui-monospace,monospace;background:#2b3138;border-radius:5px;padding:2px 6px;margin-left:4px;color:#bcd}
.hd img{width:42%;object-fit:cover;max-height:90px}
.rt{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 4px}
.rt div{text-align:center}.rt b{display:block;font-size:30px;color:#fff;letter-spacing:1px}.rt small{font-size:11px;color:#9ab}
.rt .ic{font-size:26px;color:#ffc933}
.bar{margin:6px 14px 0;height:4px;background:#2b3138;border-radius:3px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#ffc933;border-radius:3px}
.tm{display:flex;justify-content:space-between;padding:6px 14px 10px;font-size:11px;color:#9ab}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#1b2026}
.gr div{background:#14181d;padding:9px 14px;font-size:11px;color:#8a9aa8}.gr b{display:block;font-size:16px;color:#fff;margin-top:2px}
#alert{position:fixed;z-index:1100;top:calc(env(safe-area-inset-top,0px) + 90px);left:50%;transform:translate(-50%,-300%);background:#ff3b3b;color:#fff;padding:10px 18px;border-radius:24px;font-weight:700;transition:transform .4s;white-space:nowrap;box-shadow:0 0 30px #ff3b3b;font-size:13px}
#alert.show{transform:translate(-50%,0)}
#intro{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.2s,transform 1.2s;z-index:3000;font-family:ui-monospace,monospace}
#intro h1{font-size:34px;letter-spacing:12px;animation:z 2.6s ease-out forwards}
#intro p{margin-top:14px;font-size:12px;letter-spacing:3px;opacity:.7}
#intro.out{opacity:0;transform:scale(1.6);pointer-events:none}
@keyframes z{from{transform:scale(.6);opacity:0;filter:blur(8px)}to{transform:scale(1);opacity:1;filter:none}}
.leaflet-container{background:#02140d}
</style></head><body>
<div id="map"></div>
<div id="top"><span>◉ SKYRADAR</span><span id="st">LOCATING…</span></div>
<div id="rng"></div>
<div id="side"><button class="b" id="loc">◎</button><button class="b" id="lyr">🛰</button></div>
<div id="alert"></div><div id="card"></div>
<div id="intro"><h1>SKYRADAR</h1><p id="ip">ACQUIRING SIGNAL…</p></div>
<script>
function err(e){let d=document.getElementById('err');if(!d){d=document.createElement('div');d.id='err';d.style.cssText='position:fixed;z-index:5000;bottom:0;left:0;right:0;background:#400;color:#fff;font:11px monospace;padding:6px;max-height:20vh;overflow:auto';document.body.appendChild(d)}d.textContent='ERR: '+(e&&e.message||e)}
window.onerror=(m)=>err(m);
setTimeout(()=>{const i=document.getElementById('intro');i&&i.classList.add('out')},2800);
document.getElementById('intro').onclick=()=>document.getElementById('intro').classList.add('out');
const AIRLINES={AIC:'Air India',IGO:'IndiGo',SEJ:'SpiceJet',VTI:'Vistara',AXB:'Air India Express',IAD:'AirAsia India',UAE:'Emirates',ETD:'Etihad',QTR:'Qatar Airways',SIA:'Singapore Airlines',BAW:'British Airways',DLH:'Lufthansa',AFR:'Air France',KLM:'KLM',THY:'Turkish Airlines',SVA:'Saudia',GFA:'Gulf Air',OMA:'Oman Air',KAC:'Kuwait Airways',FDB:'flydubai',ABY:'Air Arabia',ALK:'SriLankan',UAL:'United Airlines',AAL:'American Airlines',DAL:'Delta',RYR:'Ryanair',EZY:'easyJet',THA:'Thai Airways',MAS:'Malaysia Airlines',CPA:'Cathay Pacific',QFA:'Qantas',ETH:'Ethiopian',FIN:'Finnair',SWR:'Swiss',AKJ:'Akasa Air',FLN:'Fly91'};
const air=c=>AIRLINES[c.slice(0,3)]||(/^[A-Z]{3}\d/.test(c)?c.slice(0,3):'Private / Unknown');
let me={lat:9.9312,lon:76.2673},range=50,planes=new Map(),sel=null,routes={},photos={},alerted={},gps=false,first=true;
const $=id=>document.getElementById(id),st=$('st'),sw=$('sw')||document.createElement('div');
const map=L.map('map',{zoomControl:false,attributionControl:false}).setView([me.lat,me.lon],9);
const dark=L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{maxZoom:18}).addTo(map);
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:18});
let isSat=false;$('lyr').onclick=()=>{isSat=!isSat;isSat?(map.removeLayer(dark),sat.addTo(map)):(map.removeLayer(sat),dark.addTo(map))};
sw.id='sw';map.getContainer().appendChild(sw);
const meM=L.marker([me.lat,me.lon],{icon:L.divIcon({className:'',html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map);
const rl=L.layerGroup().addTo(map);
function place(){const c=map.latLngToContainerPoint([me.lat,me.lon]),e=map.latLngToContainerPoint([me.lat,me.lon+(range/60)/Math.cos(me.lat*Math.PI/180)]),r=Math.hypot(e.x-c.x,e.y-c.y);Object.assign(sw.style,{width:2*r+'px',height:2*r+'px',left:c.x-r+'px',top:c.y-r+'px'})}
map.on('move zoom viewreset resize',place);
function fit(){try{const a=range/60,o=a/Math.cos(me.lat*D);map.fitBounds([[me.lat-a,me.lon-o],[me.lat+a,me.lon+o]],{padding:[10,10],animate:false})}catch(e){err(e)}place()}
const rg=$('rng');[25,50,100,200].forEach(r=>{const b=document.createElement('button');b.className='b'+(r==range?' on':'');b.textContent=r+' nm';b.onclick=()=>{range=r;[...rg.children].forEach(c=>c.classList.toggle('on',c===b));fit();load()};rg.appendChild(b)});
$('loc').onclick=()=>{fit()};
function gpsStart(){if(!navigator.geolocation){st.textContent='NO GPS · DEFAULT';return}
navigator.geolocation.watchPosition(p=>{me={lat:p.coords.latitude,lon:p.coords.longitude};meM.setLatLng([me.lat,me.lon]);st.textContent=planes.size+' AIRCRAFT · GPS';$('ip').textContent='GPS LOCK';if(!gps){gps=true;fit();load()}place()},()=>{st.textContent='GPS OFF · DEFAULT'},{enableHighAccuracy:true,maximumAge:3000})}
const D=Math.PI/180;
function dist(a,b){const dl=(b.lat-a.lat)*D,dn=(b.lon-a.lon)*D,h=Math.sin(dl/2)**2+Math.cos(a.lat*D)*Math.cos(b.lat*D)*Math.sin(dn/2)**2;return 2*3440.065*Math.asin(Math.sqrt(h))}
function adv(p,dt){const d=p.gs*dt/3600,t=p.track*D,la=p.lat+d*Math.cos(t)/60;return{lat:la,lon:p.lon+d*Math.sin(t)/(60*Math.cos(la*D))}}
const PATH='M0 -10L2 -3L10 2L10 4L2 2L1.5 7L4 9L4 10L0 9L-4 10L-4 9L-1.5 7L-2 2L-10 4L-10 2L-2 -3Z';
async function load(){try{const r=await fetch(`https://api.adsb.lol/v2/point/${me.lat.toFixed(3)}/${me.lon.toFixed(3)}/${Math.min(Math.round(range*1.3),250)}`);const j=await r.json(),now=performance.now(),seen=new Set();
(j.ac||[]).forEach(a=>{if(a.lat==null||a.lon==null||a.alt_baro==='ground')return;seen.add(a.hex);let p=planes.get(a.hex);
const d={hex:a.hex,call:(a.flight||'').trim()||a.hex.toUpperCase(),type:a.t||'—',reg:a.r||'—',lat:a.lat,lon:a.lon,alt:+a.alt_baro||0,gs:a.gs||0,track:a.track??a.true_heading??0,vr:a.baro_rate||0,t:now};
if(p)Object.assign(p,d);else{p=d;p.m=L.marker([a.lat,a.lon],{icon:L.divIcon({className:'',html:`<div class="pl"><svg viewBox="-12 -12 24 24"><path d="${PATH}"/></svg><span>${p.call}</span></div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);p.m.on('click',e=>{L.DomEvent.stopPropagation(e);pick(a.hex)});planes.set(a.hex,p)}});
for(const[k,p]of planes)if(!seen.has(k)){map.removeLayer(p.m);planes.delete(k);if(sel===k)pick(null)}
st.textContent=planes.size+' AIRCRAFT · LIVE'}catch(e){st.textContent='NO DATA'}}
async function getRoute(p){if(routes[p.call]!==undefined)return;routes[p.call]=null;
try{const r=await fetch('https://api.adsb.lol/api/0/routeset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({planes:[{callsign:p.call,lat:p.lat,lng:p.lon}]})});const j=await r.json(),d=Array.isArray(j)?j[0]:j;
if(d&&d._airports&&d._airports.length>1)routes[p.call]={ap:d._airports,codes:d._airports.map(a=>a.iata||a.icao)}}catch(e){}
if(!routes[p.call]){try{const r=await fetch('https://api.adsb.lol/api/0/route/'+p.call),d=await r.json();if(d._airports&&d._airports.length>1)routes[p.call]={ap:d._airports,codes:d._airports.map(a=>a.iata||a.icao)}}catch(e){}}
if(!routes[p.call]){try{const r=await fetch('https://opensky-network.org/api/routes?callsign='+p.call),d=await r.json();if(d.route)routes[p.call]={ap:[],codes:d.route}}catch(e){}}
if(sel===p.hex)draw()}
async function getPhoto(p){if(photos[p.hex]!==undefined)return;photos[p.hex]=null;try{const r=await fetch('https://api.planespotters.net/pub/photos/hex/'+p.hex),j=await r.json();if(j.photos&&j.photos[0])photos[p.hex]=j.photos[0].thumbnail_large.src}catch(e){}if(sel===p.hex)draw()}
function pick(h){if(sel&&planes.get(sel)){const e=planes.get(sel).m.getElement();e&&e.firstChild.classList.remove('sel')}rl.clearLayers();sel=h;const p=planes.get(h);if(!p){$('card').classList.remove('show');sel=null;return}
p.m.getElement().firstChild.classList.add('sel');getRoute(p);getPhoto(p);draw()}
map.on('click',()=>pick(null));
const hm=m=>{m=Math.max(0,Math.round(m));return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function draw(){const p=planes.get(sel);if(!p)return;const r=routes[p.call],ap=r&&r.ap&&r.ap.length>1?r.ap:null,codes=r?r.codes:null;
let pct=0,dep='—',arr='—',o,d;rl.clearLayers();
if(ap){o=ap[0];d=ap[ap.length-1];if(o.lat!=null&&d.lat!=null){const tot=dist(o,d),done=dist(o,p),rem=dist(p,d);pct=Math.min(1,done/Math.max(tot,1));if(p.gs>50){dep='~'+hm(done/p.gs*60)+' ago';arr='in ~'+hm(rem/p.gs*60)}
L.polyline([[o.lat,o.lon],[p.lat,p.lon]],{color:'#ffc933',weight:3}).addTo(rl);L.polyline([[p.lat,p.lon],[d.lat,d.lon]],{color:'#ffc933',weight:3,dashArray:'2 8',opacity:.9}).addTo(rl);
[o,d].forEach(a=>L.marker([a.lat,a.lon],{icon:L.divIcon({className:'',html:`<div class="pin">${a.iata||a.icao}</div>`,iconSize:[0,0]})}).addTo(rl))}}
const ph=photos[p.hex],vs=p.vr>100?'▲ '+p.vr+' fpm':p.vr<-100?'▼ '+Math.abs(p.vr)+' fpm':'● level';
$('card').innerHTML=`<div class="hd"><div class="l"><div class="cs">${p.call}</div><div style="margin:5px 0"><span class="ch">${p.type}</span><span class="ch">${p.reg}</span></div><div style="font-size:13px;color:#cfe">${air(p.call)}</div></div>${ph?`<img src="${ph}">`:''}</div>
<div class="rt"><div><b>${codes?codes[0]:'---'}</b><small>${ap&&ap[0].location||''}</small></div><span class="ic">✈</span><div><b>${codes?codes[codes.length-1]:'---'}</b><small>${ap&&ap[ap.length-1].location||''}</small></div></div>
<div class="bar"><i style="width:${pct*100}%"></i></div><div class="tm"><span>Departed ${dep}</span><span>Arriving ${arr}</span></div>
<div class="gr"><div>ALTITUDE<b>${p.alt.toLocaleString()} ft</b></div><div>GROUND SPEED<b>${Math.round(p.gs)} kt</b></div><div>HEADING<b>${Math.round(p.track)}°</b></div><div>V/S<b>${vs}</b></div><div>DISTANCE FROM YOU<b>${dist(me,p).toFixed(1)} nm</b></div><div>ROUTE<b>${codes?codes.join(' → '):'n/a'}</b></div></div>`;
$('card').classList.add('show')}
setInterval(()=>{if(sel)draw()},4000);
function alertCheck(p,d){if(d<4&&p.alt<45000&&Date.now()-(alerted[p.hex]||0)>300000){alerted[p.hex]=Date.now();const a=$('alert');a.textContent=`✈ ${p.call} · ${air(p.call)} OVERHEAD · ${p.alt.toLocaleString()} ft`;a.classList.add('show');navigator.vibrate&&navigator.vibrate([200,100,200]);setTimeout(()=>a.classList.remove('show'),6000);pick(p.hex)}}
function tick(t){try{tick2(t)}catch(e){err(e)}requestAnimationFrame(tick)}
function tick2(t){const ang=(t/4500%1)*360;sw.style.transform=`rotate(${ang}deg)`;const now=performance.now();
planes.forEach(p=>{const q=adv(p,(now-p.t)/1000);p.m.setLatLng([q.lat,q.lon]);const el=p.m.getElement();if(!el)return;const s=el.firstChild;s.querySelector('svg').style.transform=`rotate(${p.track}deg)`;
const dx=(q.lon-me.lon)*Math.cos(me.lat*D),dy=q.lat-me.lat;let b=Math.atan2(dx,dy)/D;if(b<0)b+=360;const diff=(ang-b+360)%360;
if(diff<14&&!s.classList.contains('hit')){s.classList.add('hit');setTimeout(()=>s.classList.remove('hit'),700)}
alertCheck(p,dist(me,q))})}
try{fit()}catch(e){err(e)}try{gpsStart()}catch(e){err(e)}load();setInterval(load,5000);requestAnimationFrame(tick);
setTimeout(()=>$('intro').classList.add('out'),2800);
</script></body></html>
